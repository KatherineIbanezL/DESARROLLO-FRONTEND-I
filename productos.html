<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo completo de Pixel Cross">
    <title>Pixel Cross - Todos los Productos</title>

    <!-- CDN Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-pixel-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-pixel-magenta fs-3" href="index.html">Pixel Cross</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <form id="form-busqueda" class="d-flex mx-auto my-2 my-lg-0 w-50" role="search">
                    <input id="input-busqueda" class="form-control me-2" type="search" placeholder="Buscar producto..." aria-label="Buscar">
                    <button class="btn btn-pixel" type="submit">Buscar</button>
                </form>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#categorias">Categorías</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    
                    <!-- Botón Modal Carrito -->
                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                        <button class="btn btn-outline-light position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                            🛒 Carrito
                            <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5">
        <!-- FILTROS DE CATEGORÍA -->
        <section class="mb-5">
            <h1 class="text-center mb-4 fw-bold">Catálogo Completo</h1>
            <div class="row g-3 justify-content-center" id="contenedor-filtros">
                <div class="col-6 col-md-3">
                    <button class="btn btn-categoria active" data-categoria="todos">Todos</button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="btn btn-categoria" data-categoria="Videojuegos">Videojuegos</button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="btn btn-categoria" data-categoria="Accesorios">Accesorios</button>
                </div>
                <div class="col-6 col-md-3">
                    <button class="btn btn-categoria" data-categoria="TCG">TCG</button>
                </div>
            </div>
        </section>

        <!-- TODOS LOS PRODUCTOS -->
        <section class="mb-5">
            <div id="productos-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <!-- Se renderizan los productos desde JS -->
            </div>
        </section>
    </main>

    <!-- MODAL CARRITO -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-pixel-dark text-white">
                    <h5 class="modal-title fw-bold" id="modalCarritoLabel">Resumen de Compras</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul id="lista-carrito" class="list-group mb-3"></ul>
                    <div class="d-flex justify-content-between align-items-center fw-bold fs-5">
                        <span>Total:</span>
                        <span id="total-carrito" class="text-pixel-magenta">$0</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" id="btn-vaciar" class="btn btn-outline-danger">Vaciar Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-pixel-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-1">&copy; 2026 Pixel Cross. Todos los derechos reservados.</p>
            <p class="mb-0">Contacto: <a href="mailto:contacto@pixelcross.cl" class="text-pixel-magenta text-decoration-none fw-bold">contacto@pixelcross.cl</a></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
